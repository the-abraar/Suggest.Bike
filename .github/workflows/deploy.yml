# Builds the static export and publishes ./out to GitHub Pages (custom domain from public/CNAME).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      price_fail_days:
        description: "Emergency only: allow on-sale prices up to this many days old (default 180). See docs/price-refresh.md."
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history: scripts/build-history.ts reads every version of bikes.json
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/qa/package-lock.json
      - run: npm ci
      - run: npm run validate
        env:
          PRICE_FAIL_DAYS: ${{ inputs.price_fail_days || 180 }}
      - run: npm run typecheck # pretypecheck generates src/data/generated, which tsc needs on a fresh checkout
      - run: npm test
      - run: npm run build
      # Bangla share cards (scripts/bn-og.mts) need a shaping renderer: Chromium from tools/qa's Playwright, cached per lockfile.
      # Runs only here, not in check.sh, so local checks pass without a browser; the script fails if any /bn/ og:image is missing.
      - run: npm ci --prefix tools/qa
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ hashFiles('tools/qa/package-lock.json') }}
      - run: npx playwright install --only-shell chromium # no-op on a cache hit; runner images already have Chromium's system libs
        working-directory: tools/qa
      - run: npm run og:bn
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
