# Builds the static export and publishes ./out to GitHub Pages (custom domain from public/CNAME).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      price_fail_days:
        description: "Emergency only: allow on-sale prices up to this many days old (default 180). See docs/price-refresh.md."
        required: false
        default: ""

permissions:
  contents: read # build job; only the deploy job gets pages and id-token

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scripts/build-history.ts reads every version of bikes.json
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/qa/package-lock.json
      - run: npm ci
      - run: npm run validate
        env:
          PRICE_FAIL_DAYS: ${{ inputs.price_fail_days || 180 }}
      - run: npm run typecheck # pretypecheck generates src/data/generated, which tsc needs on a fresh checkout
      - run: npm test
      - run: npm run build
      # Bangla share cards (scripts/bn-og.mts) need a shaping renderer: tools/qa's Playwright driving the Google Chrome
      # preinstalled on ubuntu-latest (channel "chrome"), so no browser is downloaded here.
      # Runs only here, not in check.sh, so local checks pass without a browser; the script fails if any /bn/ og:image is missing.
      - run: npm ci --prefix tools/qa
      - run: npm run og:bn
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true # v4+ drops dotfiles by default; keeps /.well-known/security.txt live

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
