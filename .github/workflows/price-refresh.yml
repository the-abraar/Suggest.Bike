# Monthly price refresh: reads the official BD distributor pages and opens or updates one PR on bot/price-refresh with
# the official price changes, availability flags and the owner's checklist. Review and merge per docs/price-refresh.md.
# It never deploys: deploy.yml runs only on a push to main (a person merging this PR) or by hand.
# Two jobs so npm code never sees a write token: `scrape` runs npm with a read-only token and no stored credential;
# `publish` holds the write token, runs no npm, and commits the files scrape uploaded.
name: price-refresh

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st = 09:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run --silent refresh:prices -- --body pr-body.md
      - run: node scripts/sources.mjs # SOURCES.md is generated from the data
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: price-refresh
          path: |
            src/data/bikes.json
            SOURCES.md
            pr-body.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: price-refresh
          # Outside the checkout: only the two data files below are copied into the tree.
          path: ${{ runner.temp }}/price-refresh
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          cp "$RUNNER_TEMP/price-refresh/src/data/bikes.json" src/data/bikes.json && cp "$RUNNER_TEMP/price-refresh/SOURCES.md" SOURCES.md
          month=$(TZ=Asia/Dhaka date +%Y-%m)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/price-refresh
          git add src/data/bikes.json SOURCES.md
          # --allow-empty: the checklist PR still opens in a month with no official change.
          git commit --allow-empty -m "Price refresh $month from official distributor pages" -m "Generated by .github/workflows/price-refresh.yml. Review per docs/price-refresh.md."
          # The token goes on this one command only; checkout stored no credential.
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push --force origin bot/price-refresh
          title="Price refresh $month: official prices and owner checklist"
          # head=owner:branch matches only this repo's branch, never a fork's branch of the same name.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$BASE&head=${GITHUB_REPOSITORY_OWNER}:bot/price-refresh" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/price-refresh/pr-body.md"
          else
            gh pr create --base "$BASE" --head bot/price-refresh --title "$title" --body-file "$RUNNER_TEMP/price-refresh/pr-body.md"
          fi
