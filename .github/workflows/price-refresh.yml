# Monthly price refresh: reads the official BD distributor pages and opens or updates one PR on bot/price-refresh with
# the official price changes, availability flags and the owner's checklist. Review and merge per docs/price-refresh.md.
# It never deploys: deploy.yml runs only on a push to main (a person merging this PR) or by hand.
name: price-refresh

on:
  schedule:
    - cron: "17 3 1 * *" # 03:17 UTC on the 1st = 09:17 in Dhaka
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run --silent refresh:prices -- --body "$RUNNER_TEMP/pr-body.md"
      - run: node scripts/sources.mjs # SOURCES.md is generated from the data
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          month=$(TZ=Asia/Dhaka date +%Y-%m)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bot/price-refresh
          git add src/data/bikes.json SOURCES.md
          # --allow-empty: the checklist PR still opens in a month with no official change.
          git commit --allow-empty -m "Price refresh $month from official distributor pages" -m "Generated by .github/workflows/price-refresh.yml. Review per docs/price-refresh.md."
          git push --force origin bot/price-refresh
          title="Price refresh $month: official prices and owner checklist"
          pr=$(gh pr list --head bot/price-refresh --base "$BASE" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base "$BASE" --head bot/price-refresh --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
