# Monthly grouped update PRs. Security updates (repo setting) open separately as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools/qa
    schedule:
      interval: monthly
    groups:
      qa:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
