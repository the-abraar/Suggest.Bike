<!doctype html>
<!-- Bangla share-card template for scripts/bn-og.mts. Mirrors app/og.png and app/bikes/[id]/og.png (same sizes, colours, layout). -->
<html lang="bn">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="CSS_HREF">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "Hind Siliguri", sans-serif; }
  .card { box-sizing: border-box; width: 1200px; height: 630px; display: none; }
  .logo { display: flex; align-items: center; justify-content: center; }
  .dot { border-radius: 50%; background: #ffc400; }
  #site { flex-direction: column; background: #1b4f91; padding: 64px; color: #fff; }
  #site .brand { display: flex; align-items: center; gap: 16px; font-size: 36px; font-weight: 700; }
  #site .logo { width: 52px; height: 52px; border-radius: 14px; background: #fff; }
  #site .dot { width: 30px; height: 30px; }
  #site h1 { font-size: 56px; font-weight: 700; margin: 36px 0 0; line-height: 1.25; }
  #site .sub { font-size: 28px; color: #d6e4f7; margin-top: 12px; }
  #site .bikes { display: flex; gap: 20px; margin-top: auto; justify-content: center; }
  #site .bikes div { background: #fff; border-radius: 24px; padding: 12px; display: flex; }
  #bike { background: #f4f6fa; padding: 56px; color: #0f1b2d; }
  #bike .left { display: flex; flex-direction: column; justify-content: space-between; width: 520px; }
  #bike .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  #bike .brand b { color: #1b4f91; font-weight: 700; }
  #bike .logo { width: 44px; height: 44px; border-radius: 12px; background: #1b4f91; }
  #bike .dot { width: 26px; height: 26px; }
  #bike .meta { font-size: 28px; color: #55657d; }
  #bike .model { font-size: 76px; font-weight: 700; line-height: 1.05; margin-top: 8px; }
  #bike .price { font-size: 46px; font-weight: 700; color: #1b4f91; margin-top: 20px; line-height: 1.2; }
  #bike .price small { font-size: 28px; font-weight: 600; }
  #bike .ex { font-size: 24px; color: #55657d; margin-top: 2px; }
  #bike .spec { font-size: 26px; color: #2b3a52; margin-top: 12px; }
  #bike .foot { font-size: 20px; color: #5c6b83; }
  #bike .art { flex: 1; display: flex; align-items: center; justify-content: center; background: #fff; border-radius: 32px; margin-left: 32px; }
</style>
</head>
<body>
  <div class="card" id="site">
    <div class="brand"><div class="logo"><div class="dot"></div></div>suggest.bike</div>
    <h1>বাইক কেনার আগে একবার এখানে আসুন।</h1>
    <div class="sub">আসল মাইলেজ · পার্টসের দাম · মিস্ত্রির মতামত · আসল মাসিক খরচ</div>
    <div class="bikes"></div>
  </div>
  <div class="card" id="bike">
    <div class="left">
      <div class="brand"><div class="logo"><div class="dot"></div></div><span>suggest<b>.bike</b></span></div>
      <div>
        <div class="meta"></div>
        <div class="model"></div>
        <div class="price"></div>
        <div class="ex"></div>
        <div class="spec"></div>
      </div>
      <div class="foot">আসল মাইলেজ, পার্টসের দাম ও আসল মাসিক খরচ — বাংলাদেশ</div>
    </div>
    <div class="art"><img width="540" height="324" alt=""></div>
  </div>
<script>
  // Called by scripts/bn-og.mts: show(null, imgs) = site card, show(bike) = bike card.
  const $ = (s) => document.querySelector(s);
  function show(d, imgs) {
    $("#site").style.display = d ? "none" : "flex";
    $("#bike").style.display = d ? "flex" : "none";
    if (!d) return $("#site .bikes").replaceChildren(...imgs.map((src) => { const box = document.createElement("div"); box.append(Object.assign(new Image(300, 180), { src })); return box; }));
    for (const k of ["meta", "model", "ex", "spec"]) $("#bike ." + k).textContent = d[k];
    $("#bike .price").replaceChildren(d.price, Object.assign(document.createElement("small"), { textContent: d.suffix }));
    $("#bike .art img").src = d.art;
  }
</script>
</body>
</html>
